    <title>Sandy Erhard Dashboard - ECA MEDIA BO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #003D5C 0%, #001a2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
        }
        .logo {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #C9A961;
            font-weight: 300;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 40px;
        }
        .loader {
            border: 4px solid rgba(201, 169, 97, 0.2);
            border-radius: 50%;
            border-top: 4px solid #C9A961;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 16px;
            color: #C9A961;
            letter-spacing: 1px;
        }
        .footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
        }
        a {
            color: #C9A961;
            text-decoration: none;
        }
    </style>
</head>
